<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TravelPack AI — smart packing lists</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="hero">
  <h1>🧳 TravelPack AI</h1>
  <p>Answer three questions, get a complete packing list. Works offline, no account, no API keys.</p>
</header>

<main class="wrap">
  <section class="card">
    <h2>Plan your trip</h2>
    <div class="form-grid">
      <label>Trip name <input id="tripName" type="text" placeholder="e.g. Lisbon long weekend"></label>
      <label>Trip type <select id="tripType"></select></label>
      <label>Days <input id="days" type="number" min="1" max="60" value="5"></label>
      <label>Weather <select id="weather"></select></label>
    </div>
    <div class="actions">
      <button id="genBtn" class="primary">Generate packing list</button>
      <button id="printBtn">Print / PDF</button>
    </div>
    <p id="tipBox" class="tip" style="display:none"></p>
  </section>

  <div id="progressWrap" class="card" style="display:none">
    <div class="progress"><div id="progressBar"></div></div>
    <p id="progressText" class="muted"></p>
  </div>

  <div id="forgetStrip" class="forget" style="display:none"></div>

  <div id="listWrap"></div>

  <section class="card">
    <h2>Saved trips</h2>
    <div id="savedList"><p class="muted">No saved trips yet.</p></div>
  </section>
</main>

<footer class="foot"><p>TravelPack AI · 100% local — your trips never leave this browser.</p></footer>

<script src="js/packbank.js"></script>
<script src="js/logic.js"></script>
<script src="js/app.js"></script>
</body>
</html>
